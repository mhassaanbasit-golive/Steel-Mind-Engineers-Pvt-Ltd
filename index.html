    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10001;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #boot .boot-logo {

        height: auto;
      }
      @media (min-width: 768px) {
        #boot .boot-logo {
          width: 240px;
        }
      }
      #boot .boot-bar {
        width: 180px;
        height: 2px;
        margin-top: 28px;
        background-color: rgba(15, 23, 42, 0.12);
        position: relative;
        overflow: hidden;
      }
      @media (min-width: 768px) {
        #boot .boot-bar {
          width: 220px;
        }
      }
      #boot .boot-fill {
        width: 100%;
        height: 100%;
        background-color: #1E3A8A;
        transform: scaleX(0);
        transform-origin: left;
      }
      #boot .boot-num {
        margin-top: 14px;

  <body>
    <div id="boot">
      <img
        class="boot-logo"
        src="https://res.cloudinary.com/cyfb9slf/image/upload/v1791401768/Landscape.jpg"

        width="240"
        height="88"
      />
      <div class="boot-bar">
        <div class="boot-fill"></div>
      </div>
      <div class="boot-num">0%</div>
    </div>
    <script>
      (function() {
        var p = 10;
        var fill = document.querySelector('.boot-fill');
        var num = document.querySelector('.boot-num');
        window.__bootInterval = setInterval(function() {
          if (p < 85) {
            p += Math.floor(Math.random() * 8) + 4;
            if (p > 85) p = 85;
            if (fill) fill.style.transform = 'scaleX(' + (p / 100) + ')';
            if (num) num.textContent = p + '%';
          }
        }, 80);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
